<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Palette Direction Review</title>
	<link rel="stylesheet" href="/styles.css">
</head>
<body>
	<header>
		<p class="eyebrow">Targeted mechanism review</p>
		<h1>Which directions hold up?</h1>
		<p>Mark every complete treatment that is independently valid. Options are blinded and do not form a ranking.</p>
	</header>
	<main>
		<section class="review-heading">
			<div>
				<p id="progress"></p>
				<h2 id="case-title"></h2>
			</div>
			<div class="navigation">
				<button id="previous" type="button">Previous</button>
				<button id="next" type="button">Next</button>
			</div>
		</section>
		<section id="options" class="options" aria-label="Blinded complete treatments"></section>
		<section class="assessment" aria-labelledby="assessment-title">
			<h2 id="assessment-title">Assessment</h2>
			<div class="fallback-options">
				<label><input id="none-valid" type="checkbox"> None confidently valid</label>
				<label><input id="uncertain" type="checkbox"> Uncertain</label>
			</div>
			<label for="comment">Optional comment</label>
			<textarea id="comment" maxlength="2000" rows="4" placeholder="Only add detail if it helps explain the mechanism."></textarea>
			<div class="save-row">
				<p id="save-status" role="status"></p>
				<button id="save" type="button">Save assessment</button>
			</div>
		</section>
	</main>
	<script type="module" src="/app.js"></script>
</body>
</html>
