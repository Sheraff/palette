<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>perception round 4 — the shape round</title>
		<link rel="stylesheet" href="/styles.css" />
	</head>
	<body class="oracle-body">
		<header class="oracle-bar oracle-head">
			<div class="oracle-prompt">
				<!-- Every word here comes from the FIXTURE, never from this file. This round asks TWO
				     questions of one reviewer in one sitting, and the whole risk of it is that one gets
				     answered under the other's reading — so the question, the instruction and the
				     stimulus-type label all travel with the answers rather than living in markup that
				     could drift from them. The identity wording is byte-identical to bracketing rounds
				     1-3; the accent wording is accent-real-1's, extended by the clarification that
				     governed its scored answers. -->
				<p id="preamble" class="oracle-preamble"></p>
				<p id="question">loading…</p>
				<p id="instruction" class="oracle-instruction"></p>
			</div>
			<p id="progress"></p>
		</header>

		<main id="stage" class="oracle-stage" aria-live="polite"></main>

		<!-- Optional per-item note, on every round of every kind. Never required, never blocks. -->
		<div id="notebox" class="round-notebox" hidden>
			<label class="round-note-label" for="noteinput">Note on this item — enter saves, esc closes</label>
			<textarea id="noteinput" class="round-note-input" rows="4"></textarea>
		</div>

		<footer class="oracle-bar oracle-foot">
			<ul id="mapping" class="oracle-mapping"></ul>
			<p id="notemark" class="round-notemark"></p>
			<p id="itemref" class="round-itemref" title="click to select"></p>
			<p id="pending" class="oracle-pending"></p>
			<p id="status">…</p>
			<!-- Generated by the kit from the same table its dispatcher reads. NEVER hand-write key
			     names here: a footer that advertises a key the page stopped binding is one of the two
			     incidents the kit exists to prevent. -->
			<p id="keymap" class="oracle-keys round-keymap"></p>
			<p class="oracle-keys"><a href="/">all reviews</a></p>
		</footer>
	</body>
	<script type="module" src="/perception-4.js"></script>
</html>
