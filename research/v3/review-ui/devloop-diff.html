<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>dev loop — diff</title>
		<link rel="stylesheet" href="/styles.css" />
	</head>
	<body class="oracle-body">
		<header class="oracle-bar oracle-head">
			<div class="oracle-prompt">
				<p id="preamble" class="oracle-preamble"></p>
				<p id="question">loading…</p>
				<p id="instruction" class="oracle-instruction"></p>
			</div>
			<p id="progress"></p>
		</header>

		<!-- `devloop-stage` turns the kit's composite from a stack into a row: a before/after pair only
		     reads as a comparison when the two mocks are beside each other. -->
		<main id="stage" class="oracle-stage devloop-stage" aria-live="polite"></main>

		<footer class="oracle-bar oracle-foot">
			<p id="context" class="devloop-context"></p>
			<p id="itemref" class="round-itemref" title="click to select"></p>
			<p id="status">…</p>
			<!-- Generated by the kit from the table its dispatcher reads. Never hand-written. -->
			<p id="keymap" class="oracle-keys round-keymap"></p>
			<p class="oracle-keys"><a href="/">dev loop index</a></p>
		</footer>
	</body>
	<script type="module" src="/devloop-diff.js"></script>
</html>
