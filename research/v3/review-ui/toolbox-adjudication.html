<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>toolbox adjudication</title>
		<link rel="stylesheet" href="/styles.css" />
	</head>
	<body class="oracle-body">
		<header class="oracle-bar oracle-head">
			<div class="oracle-prompt">
				<!-- Title, then description, then the standing criterion. The order is deliberate and it
				     is why the ids are not in the kit's example order: on a round whose whole stimulus is
				     text, the reviewer needs to know WHICH proposal they are reading before they read it.
				     Every one of these is filled from the fixture — an answer only means something
				     against the exact words it was answered under. -->
				<p id="question">loading…</p>
				<p id="preamble" class="oracle-preamble"></p>
				<p id="instruction" class="oracle-instruction"></p>
			</div>
			<p id="progress"></p>
		</header>

		<!-- What it serves, what it costs, my call, and where the proposal came from — the fixture's
		     `framing`, printed verbatim, one fact per line. There is no artwork on this round: the
		     item IS the words, and the carrier panel the push path requires is never drawn. -->
		<main id="stage" class="oracle-stage" aria-live="polite"></main>

		<footer class="oracle-bar oracle-foot">
			<ul id="mapping" class="oracle-mapping"></ul>
			<p id="pending" class="oracle-pending"></p>
			<p id="status">…</p>
			<!-- Generated by the kit, from the same table the dispatcher reads. Never hand-written:
			     the endorsement page's hand-written footer advertised keys it had stopped binding. -->
			<p id="keymap" class="oracle-keys round-keymap"></p>
		</footer>
	</body>
	<script type="module" src="/toolbox-adjudication.js"></script>
</html>
