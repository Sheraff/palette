<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>endorsement recheck</title>
		<link rel="stylesheet" href="/styles.css" />
	</head>
	<body class="oracle-body">
		<header class="oracle-bar oracle-head">
			<div class="oracle-prompt">
				<!-- What newly fails on THIS palette, and why. Served from the fixture, never written
				     here: an answer only means something against the exact words it was answered
				     under. -->
				<p id="preamble" class="oracle-preamble"></p>
				<p id="framing" class="oracle-preamble"></p>
				<p id="question">loading…</p>
				<p id="instruction" class="oracle-instruction"></p>
			</div>
			<p id="progress"></p>
		</header>

		<!-- The mock player goes here, rendered by the one renderer (`/mock.js`), plus the measured
		     numbers behind the failure line and the gradient note where there is one. -->
		<main id="stage" class="oracle-stage" aria-live="polite"></main>

		<footer class="oracle-bar oracle-foot">
			<ul id="mapping" class="oracle-mapping"></ul>
			<p id="status">…</p>
			<p class="oracle-keys">
				<b>u</b> undo one · <b>r</b> release when finished · <a href="/">all reviews</a>
			</p>
		</footer>
	</body>
	<script type="module" src="/endorsement-recheck.js"></script>
</html>
