<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>endorsement recheck</title>
		<link rel="stylesheet" href="/styles.css" />
	</head>
	<body class="oracle-body">
		<header class="oracle-bar oracle-head">
			<div class="oracle-prompt">
				<!-- What newly fails on THIS palette, and why. Served from the fixture, never written
				     here: an answer only means something against the exact words it was answered
				     under. -->
				<p id="failure-label" class="recheck-failure-label"></p>
				<p id="preamble" class="recheck-failure"></p>
				<p id="framing" class="oracle-preamble"></p>
				<p id="question">loading…</p>
				<p id="instruction" class="oracle-instruction"></p>
			</div>
			<p id="progress"></p>
		</header>

		<!-- The mock player goes here, rendered by the one renderer (`/mock.js`), plus the measured
		     numbers behind the failure line and the gradient note where there is one. -->
		<main id="stage" class="oracle-stage" aria-live="polite"></main>

		<footer class="oracle-bar oracle-foot">
			<ul id="mapping" class="oracle-mapping"></ul>
			<p id="status">…</p>
			<!-- Every key this page binds, in the markup rather than drawn by JS. The answer keys are
			     also listed above by `#mapping` with their glosses, but that list only exists once the
			     round has loaded; these hints are here even if it never does. The reviewer's report on
			     the first revision was "no way for me to answer, nor a way to go to the 2nd palette",
			     and an affordance that depends on a fetch is not an affordance. -->
			<p class="oracle-keys">
				<b>1</b> keep · <b>2</b> rule is right · <b>3</b> can't tell ·
				<b>j</b>/<b>k</b> or <b>←</b>/<b>→</b> move between palettes ·
				<b>u</b> undo one · <b>r</b> release when finished · <a href="/">all reviews</a>
			</p>
		</footer>
	</body>
	<script type="module" src="/endorsement-recheck.js"></script>
</html>
